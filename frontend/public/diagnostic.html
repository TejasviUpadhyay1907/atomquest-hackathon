<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Diagnostic Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.good {
            background: #52c41a;
            color: white;
        }
        .status.bad {
            background: #ff4d4f;
            color: white;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #5568d3;
        }
        button.danger {
            background: #ff4d4f;
        }
        button.danger:hover {
            background: #e63946;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
        .log {
            max-height: 300px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        .log-entry.error {
            border-left-color: #ff4d4f;
            background: rgba(255, 77, 79, 0.1);
        }
        .log-entry.success {
            border-left-color: #52c41a;
            background: rgba(82, 196, 26, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Auth Diagnostic Tool</h1>
        <p class="subtitle">Debug authentication issues in the Goal Tracking Portal</p>

        <div class="section">
            <h3>📊 Current Status</h3>
            <div id="status">Checking...</div>
        </div>

        <div class="section">
            <h3>🔑 Token Information</h3>
            <div id="tokenInfo">Loading...</div>
        </div>

        <div class="section">
            <h3>👤 User Information</h3>
            <div id="userInfo">Loading...</div>
        </div>

        <div class="section">
            <h3>🧪 Actions</h3>
            <button onclick="testLogin()">Test Login</button>
            <button onclick="testAPI()">Test API Call</button>
            <button onclick="clearAuth()" class="danger">Clear Auth Data</button>
            <button onclick="location.reload()">Refresh Page</button>
        </div>

        <div class="section">
            <h3>📝 Activity Log</h3>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const logDiv = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
        }

        function checkStatus() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            const statusDiv = document.getElementById('status');
            const tokenDiv = document.getElementById('tokenInfo');
            const userDiv = document.getElementById('userInfo');

            if (token && user) {
                statusDiv.innerHTML = '✅ Authenticated <span class="status good">LOGGED IN</span>';
                tokenDiv.innerHTML = `
                    <strong>Token:</strong> ${token.substring(0, 30)}...<br>
                    <strong>Length:</strong> ${token.length} characters<br>
                    <strong>Format:</strong> ${token.startsWith('eyJ') ? 'Valid JWT' : 'Invalid format'}
                `;
                
                try {
                    const userData = JSON.parse(user);
                    userDiv.innerHTML = `
                        <strong>Name:</strong> ${userData.full_name}<br>
                        <strong>Email:</strong> ${userData.email}<br>
                        <strong>Role:</strong> ${userData.role}<br>
                        <strong>ID:</strong> ${userData.id}
                    `;
                } catch (e) {
                    userDiv.innerHTML = '<span style="color: red;">Error parsing user data</span>';
                }
                
                log('✅ Auth data found in localStorage', 'success');
            } else {
                statusDiv.innerHTML = '❌ Not Authenticated <span class="status bad">LOGGED OUT</span>';
                tokenDiv.innerHTML = '<em>No token found</em>';
                userDiv.innerHTML = '<em>No user data found</em>';
                log('⚠️ No auth data in localStorage', 'error');
            }
        }

        async function testLogin() {
            log('🔄 Testing login with emp1@demo.com...');
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'emp1@demo.com',
                        password: 'password123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    log(`✅ Login successful! Welcome ${data.user.full_name}`, 'success');
                    checkStatus();
                } else {
                    const error = await response.json();
                    log(`❌ Login failed: ${error.detail}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }

        async function testAPI() {
            const token = localStorage.getItem('token');
            
            if (!token) {
                log('❌ No token found. Please login first.', 'error');
                return;
            }

            log('🔄 Testing API call to /api/goals/my-goals...');

            try {
                const response = await fetch(`${API_URL}/api/goals/my-goals`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    log(`✅ API call successful! Found ${data.length} goals`, 'success');
                } else {
                    log(`❌ API call failed: ${response.status} ${response.statusText}`, 'error');
                    if (response.status === 401) {
                        log('⚠️ Token is invalid or expired', 'error');
                    }
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }

        function clearAuth() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            log('🗑️ Cleared all auth data', 'info');
            checkStatus();
        }

        // Initial check
        checkStatus();
        log('🚀 Diagnostic tool loaded');
    </script>
</body>
</html>
